# Up next row ${n} (used as `- obj: !include`). Not tappable (read-only queue).
id: ms_q_row_${n}
width: 100%
height: 52
hidden: true
clickable: false
scrollable: false
border_width: 1
border_side: [BOTTOM]
border_color: ms_c_line_soft
layout:
  type: flex
  flex_flow: ROW
  flex_align_cross: CENTER
  flex_align_track: CENTER
  pad_column: 14
  pad_row: 0
widgets:
  - label:
      id: ms_q_row_${n}_num
      text: ""
      width: 22
      styles: ms_st_label
  - obj:
      width: 10
      flex_grow: 1
      height: 46
      clickable: false
      scrollable: false
      layout:
        type: flex
        flex_flow: COLUMN
        flex_align_main: CENTER
        pad_row: 2
        pad_column: 0
      widgets:
        - label:
            id: ms_q_row_${n}_title
            text: ""
            width: 100%
            long_mode: DOT
            height: 21  # one line, so DOT truncates instead of wrapping
            text_font: ms_sans16
            text_color: ms_c_fg
        - label:
            id: ms_q_row_${n}_artist
            text: ""
            width: 100%
            long_mode: DOT
            height: 15  # one line, so DOT truncates instead of wrapping
            text_font: ms_mono12
            text_color: ms_c_dim
  - label:
      id: ms_q_row_${n}_dur
      text: ""
      styles: ms_st_label
