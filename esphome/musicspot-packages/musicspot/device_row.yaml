# Setup > output device row ${n}: update script. vars: n (1..5), idx (n - 1).
# Widget: widgets/device_row.yaml. Spotify plays on one device at a time (D23).

script:
  - id: ms_device_row_${n}_set
    then:
      - if:
          condition:
            lambda: return id(ms_devices).size() > ${idx};
          then:
            - lvgl.label.update:
                id: ms_dev_${n}_label
                text: !lambda return id(ms_devices)[${idx}];
            - if:
                condition:
                  lambda: return id(ms_active_device) == ${idx};
                then:
                  - lvgl.widget.update:
                      id: ms_dev_${n}_box
                      bg_opa: COVER
                      border_color: ms_c_accent
                  - lvgl.widget.show: ms_dev_${n}_check
                else:
                  - lvgl.widget.update:
                      id: ms_dev_${n}_box
                      bg_opa: TRANSP
                      border_color: 0x4A4A4A
                  - lvgl.widget.hide: ms_dev_${n}_check
            - lvgl.widget.show: ms_dev_${n}
          else:
            - lvgl.widget.hide: ms_dev_${n}
