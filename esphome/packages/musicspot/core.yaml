                                    text_font: ms_digits40
                                    text_color: ms_c_fg
                                # x follows the time's width: IBM Plex Mono advances 0.6 em = 24 px per glyph
                                - label:
                                    id: ms_np_dur
                                    text: ""
                                    align: BOTTOM_LEFT
                                    x: 104
                                    y: -6
                                    text_font: ms_mono16
                                    text_color: ms_c_dim
              # Progress: 2 px line, accent fill, 3x12 playhead
              - obj:
                  width: 100%
                  height: 12
                  scrollable: false
                  widgets:
                    - slider:
                        id: ms_progress
                        align: CENTER
                        width: 100%
                        height: 2
                        min_value: 0
                        max_value: 1000
                        value: 0
                        radius: 0
                        bg_color: ms_c_line
                        bg_opa: COVER
                        indicator:
                          radius: 0
                          bg_color: ms_c_accent
                        knob:
                          radius: 0
                          bg_color: ms_c_fg
                          pad_top: 5
                          pad_bottom: 5
                          pad_left: 0
                          pad_right: 1
                        on_press:
                          - lambda: id(ms_seeking) = true;
                        on_release:
                          # Jump locally right away; Spotify reports the new position a moment later
                          - lambda: |-
                              id(ms_seeking) = false;
                              id(ms_pos_ms) = (int) ((int64_t) x * id(ms_dur_ms) / 1000);
                              id(ms_pos_at) = millis();
                          - script.execute:
                              id: ms_send_input
                              type: control
                              arg: seek
                              value: !lambda return (int) ((int64_t) x * id(ms_dur_ms) / 1000);
