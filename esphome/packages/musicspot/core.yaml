# MusicSpot thin client, design C — screens, API actions (inbound) and input events (outbound).
#
# The device holds no Spotify logic and no Home Assistant entity IDs:
#   inbound:  the integration calls the API actions below (esphome.<device>_show_now_playing, ...)
#   outbound: every touch is fired as HA event `esphome.musicspot_input` {type, arg, value}
# Protocol: docs/panel-protocol.md. Look: design/mockups/design-c.html.
# Requires the hardware package ids: my_display, my_touchscreen, display_backlight.

packages:
  theme: !include theme.yaml
  list_row_1: !include { file: list_row.yaml, vars: { n: 1, idx: 0 } }
  list_row_2: !include { file: list_row.yaml, vars: { n: 2, idx: 1 } }
  list_row_3: !include { file: list_row.yaml, vars: { n: 3, idx: 2 } }
  list_row_4: !include { file: list_row.yaml, vars: { n: 4, idx: 3 } }
  list_row_5: !include { file: list_row.yaml, vars: { n: 5, idx: 4 } }
  list_row_6: !include { file: list_row.yaml, vars: { n: 6, idx: 5 } }
  tile_1: !include { file: tile.yaml, vars: { n: 1, idx: 0 } }
