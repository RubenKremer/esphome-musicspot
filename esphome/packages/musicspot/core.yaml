    # ---------------- IDLE CLOCK (after 2 min; any tap wakes) ----------------
    - id: ms_page_idle
      bg_color: ms_c_idle_bg
      bg_opa: COVER
      scrollable: false
      widgets:
        - button:
            width: 480
            height: 480
            align: CENTER
            pressed:
              bg_opa: TRANSP
            on_click:
              - script.execute: ms_wake
        - label:
            id: ms_idle_date
            text: ""
            x: 32
            y: 28
            clickable: false
            text_font: ms_mono12
            text_color: ms_c_idle_dim
            text_letter_space: 1
        - label:
            id: ms_idle_device
            text: ""
            align: TOP_RIGHT
            x: -32
            y: 28
            clickable: false
            text_font: ms_mono12
            text_color: ms_c_idle_dim
            text_letter_space: 1
        - obj:
            align: TOP_MID
            y: 128
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              pad_row: 0
              pad_column: 0
            widgets:
              - label: { id: ms_idle_hh, text: "00", text_font: ms_digits124, text_color: ms_c_idle_fg, text_letter_space: -5 }
              - label: { text: ":", text_font: ms_digits124, text_color: ms_c_accent_dim }
              - label: { id: ms_idle_mm, text: "00", text_font: ms_digits124, text_color: ms_c_idle_fg, text_letter_space: -5 }
        - obj:
            align: TOP_MID
