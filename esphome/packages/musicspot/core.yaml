# -------------------------------------------
# State
# -------------------------------------------
globals:
  - { id: ms_playing, type: bool, initial_value: "false" }
  - { id: ms_pos_ms, type: int, initial_value: "0" }
  - { id: ms_dur_ms, type: int, initial_value: "0" }
  - { id: ms_pos_at, type: uint32_t, initial_value: "0" }
  - { id: ms_seeking, type: bool, initial_value: "false" }
  - { id: ms_art_url, type: std::string, initial_value: '""' }
  - { id: ms_volume, type: int, initial_value: "0" }
  - { id: ms_vol_drag, type: bool, initial_value: "false" }
  - { id: ms_vol_hold_until, type: uint32_t, initial_value: "0" }
  - { id: ms_img_busy, type: bool, initial_value: "false" }
  # Optimistic toggles: shown at once, Spotify state ignored for 4 s after a tap
  - { id: ms_shuffle, type: bool, initial_value: "false" }
  - { id: ms_liked, type: bool, initial_value: "false" }
  - { id: ms_shuffle_hold_until, type: uint32_t, initial_value: "0" }
  - { id: ms_like_hold_until, type: uint32_t, initial_value: "0" }
  - { id: ms_play_hold_until, type: uint32_t, initial_value: "0" }
  - { id: ms_pos_hold_until, type: uint32_t, initial_value: "0" }
  - { id: ms_np_cur_title, type: std::string, initial_value: '""' }
  - { id: ms_np_idle, type: bool, initial_value: "true" }
  # Settings kept on the panel across reboots (brightness, clock timeout, dim at night)
  - { id: ms_bri_user, type: int, restore_value: yes, initial_value: "70" }
  - { id: ms_dim_night, type: bool, restore_value: yes, initial_value: "false" }
  - { id: ms_clock_after, type: int, restore_value: yes, initial_value: "2" }
  # Night hours (minutes since midnight) come from Home Assistant; kept for offline use
  - { id: ms_night_start, type: int, restore_value: yes, initial_value: "1320" }
  - { id: ms_night_end, type: int, restore_value: yes, initial_value: "420" }
  - { id: ms_dim_suspended, type: bool, initial_value: "false" }
  - { id: ms_bri_override, type: bool, initial_value: "false" }
  - { id: ms_bri_target, type: int, initial_value: "70" }
  - { id: ms_bri_applied, type: int, initial_value: "-1" }
  - { id: ms_sleep_minutes, type: int, initial_value: "0" }
  - { id: ms_sleep_end_at, type: uint32_t, initial_value: "0" }
  - { id: ms_last_touch, type: uint32_t, initial_value: "0" }
  # Search
  - { id: ms_query, type: std::string, initial_value: '""' }
  - { id: ms_scope, type: int, initial_value: "0" }
  - { id: ms_kb_num, type: bool, initial_value: "false" }
  - { id: ms_s_hits, type: int, initial_value: "0" }
  - { id: ms_s_tags, type: std::vector<std::string> }
  - { id: ms_s_texts, type: std::vector<std::string> }
  - { id: ms_brightness, type: int, initial_value: "70" }  # shown on the bar (= ms_bri_user)
  - { id: ms_bri_drag, type: bool, initial_value: "false" }
  - { id: ms_grid, type: bool, initial_value: "false" }
  - { id: ms_now_index, type: int, initial_value: "-1" }
  - { id: ms_nums, type: std::vector<std::string> }
  - { id: ms_titles, type: std::vector<std::string> }
  - { id: ms_subtitles, type: std::vector<std::string> }
  - { id: ms_counts, type: std::vector<std::string> }
  - { id: ms_thumbs, type: std::vector<std::string> }
  - { id: ms_devices, type: std::vector<std::string> }
  - { id: ms_q_nums, type: std::vector<std::string> }
  - { id: ms_q_titles, type: std::vector<std::string> }
  - { id: ms_q_artists, type: std::vector<std::string> }
  - { id: ms_q_durations, type: std::vector<std::string> }
  - { id: ms_active_device, type: int, initial_value: "-1" }
  - { id: ms_awake, type: bool, initial_value: "true" }
  - { id: ms_idle, type: bool, initial_value: "false" }
  # Boot splash
  - { id: ms_splash_done, type: bool, initial_value: "false" }
  - { id: ms_splash_step, type: int, initial_value: "-1" }
  - { id: ms_splash_seg, type: int, initial_value: "0" }
  - { id: ms_splash_pct, type: int, initial_value: "0" }
  - { id: ms_splash_devices, type: int, initial_value: "-1" }
  - { id: ms_np_received, type: bool, initial_value: "false" }

http_request:
  verify_ssl: false
  timeout: 10s

# Diagnostics while chasing the Albums-grid reboot: reset reason + memory in HA and the log
debug:
  update_interval: 10s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason

sensor:
  - platform: debug
    free:
      name: Heap free
    block:
      name: Heap largest block
    psram:
      name: PSRAM free

time:
  - platform: homeassistant
    id: ms_time

image:
  - platform: online_image
    id: ms_art
    url: "http://localhost/musicspot-none.jpg"
    format: JPEG
    type: RGB565
    resize: 150x150
    on_download_finished:
      - lvgl.image.update:
          id: ms_art_img
          src: ms_art
      - lvgl.widget.show: ms_art_img
    on_error:
      - lvgl.widget.hide: ms_art_img

# -------------------------------------------
# Scripts
# -------------------------------------------
script:
  # Outbound input event.
  # type: tap | queue | back | page | tab | device | control | awake | hello
  # arg:  control command (play_pause, next, previous, shuffle, like, volume, seek) or ""
  # value: slot (1-based), page delta, tab (0-3), volume %, seek ms, awake 0/1
  - id: ms_send_input
    mode: queued
    parameters:
      type: string
      arg: string
      value: int
    then:
      - homeassistant.event:
          event: esphome.musicspot_input
          data:
            type: !lambda return type;
            arg: !lambda return arg;
            value: !lambda return to_string(value);

  # Events sent before Home Assistant subscribes are dropped: wait for the subscription
  - id: ms_send_hello
    mode: restart
    then:
      - wait_until:
          condition:
            api.connected:
              state_subscription_only: true
          timeout: 30s
      - delay: 2s
      - script.execute:
          id: ms_send_input
          type: hello
          arg: ""
          value: 0

  - id: ms_set_awake
    parameters:
      awake: bool
    then:
      - if:
          condition:
            lambda: return id(ms_awake) != awake;
          then:
            - lambda: id(ms_awake) = awake;
            - script.execute:
                id: ms_send_input
                type: awake
                arg: ""
                value: !lambda "return awake ? 1 : 0;"

  # Banner only when no Home Assistant (state-subscribed) client is connected
  - id: ms_update_offline
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            or:
              - api.connected:
                  state_subscription_only: true
              # The splash's HOME ASSISTANT API line already shows this
              - lambda: return !id(ms_splash_done);
          then:
            - lvgl.widget.hide: ms_offline
          else:
            - lvgl.widget.show: ms_offline

  - id: ms_toast
    parameters:
      message: string
    then:
      - lvgl.label.update:
          id: ms_toast_label
          text: !lambda return message;
      - lvgl.widget.show: ms_toast_box
      - script.execute: ms_hide_toast

  - id: ms_hide_toast
    mode: restart
    then:
      - delay: 2500ms
      - lvgl.widget.hide: ms_toast_box

  # Navigation: 0 = PLAYING, 1 = LIBRARY, 2 = SETUP
  - id: ms_nav
    parameters:
      screen: int
    then:
      - if:
          condition:
            lambda: return id(ms_splash_done) && !id(ms_idle);
          then:
            - lvgl.widget.show: ms_navbar
      - lvgl.widget.hide: ms_nav_ind_0
      - lvgl.widget.hide: ms_nav_ind_1
      - lvgl.widget.hide: ms_nav_ind_2
      - if:
          condition:
            lambda: return screen == 0;
          then:
            - lvgl.page.show: ms_page_now
            - lvgl.widget.show: ms_nav_ind_0
      - if:
          condition:
            lambda: return screen == 1;
          then:
            - lvgl.page.show: ms_page_lib
            - lvgl.widget.show: ms_nav_ind_1
      - if:
          condition:
            lambda: return screen == 2;
          then:
            - lvgl.page.show: ms_page_setup
            - lvgl.widget.show: ms_nav_ind_2
      - lvgl.label.update:
          id: ms_nav_lbl_0
          text_color: !lambda "return screen == 0 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"
      - lvgl.label.update:
          id: ms_nav_lbl_1
          text_color: !lambda "return screen == 1 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"
      - lvgl.label.update:
          id: ms_nav_lbl_2
          text_color: !lambda "return screen == 2 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"

  # Library tabs: highlight the active one
  - id: ms_tabs_render
    parameters:
      tab: int
    then:
      - lvgl.widget.update:
          id: ms_tab_0
          border_width: !lambda "return tab == 0 ? 2 : 0;"
      - lvgl.label.update:
          id: ms_tab_0_lbl
          text_color: !lambda "return tab == 0 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_tab_1
          border_width: !lambda "return tab == 1 ? 2 : 0;"
      - lvgl.label.update:
          id: ms_tab_1_lbl
          text_color: !lambda "return tab == 1 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_tab_2
          border_width: !lambda "return tab == 2 ? 2 : 0;"
      - lvgl.label.update:
          id: ms_tab_2_lbl
          text_color: !lambda "return tab == 2 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_tab_3
          border_width: !lambda "return tab == 3 ? 2 : 0;"
      - lvgl.label.update:
          id: ms_tab_3_lbl
          text_color: !lambda "return tab == 3 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x8A8A8A);"

  # Play/pause icons on PLAYING and the idle clock, from ms_playing
  - id: ms_render_play
    then:
      - lvgl.label.update:
          id: ms_idle_state
          text: !lambda |-
            if (id(ms_np_idle)) return std::string("");
            return std::string(id(ms_playing) ? "PLAYING" : "PAUSED");
      - lvgl.widget.update:
          id: ms_idle_dot
          bg_color: !lambda "return id(ms_playing) ? lv_color_hex(0xB04A12) : lv_color_hex(0x5A5A5A);"
      - if:
          condition:
            lambda: return id(ms_playing);
          then:
            - lvgl.widget.hide: ms_ic_play_img
            - lvgl.widget.hide: ms_idle_play_img
            - lvgl.widget.show: ms_ic_pause_img
            - lvgl.widget.show: ms_idle_pause_img
          else:
            - lvgl.widget.hide: ms_ic_pause_img
            - lvgl.widget.hide: ms_idle_pause_img
            - lvgl.widget.show: ms_ic_play_img
            - lvgl.widget.show: ms_idle_play_img

  # Tap on play/pause: flip at once, freeze/resume the local progress at its current point
  - id: ms_tap_play_pause
    then:
      - lambda: |-
          int32_t pos = id(ms_pos_ms);
          if (id(ms_playing)) pos += millis() - id(ms_pos_at);
          if (pos > id(ms_dur_ms)) pos = id(ms_dur_ms);
          id(ms_pos_ms) = pos;
          id(ms_pos_at) = millis();
          id(ms_playing) = !id(ms_playing);
          id(ms_play_hold_until) = millis() + 4000;
      - script.execute: ms_render_play
      - script.execute: { id: ms_send_input, type: control, arg: play_pause, value: 0 }

  # Tap on next/previous: the next track is unknown, but the progress starts at 0:00
  - id: ms_tap_skip
    parameters:
      command: string
    then:
      - lambda: |-
          id(ms_pos_ms) = 0;
          id(ms_pos_at) = millis();
          id(ms_pos_hold_until) = millis() + 4000;
      - lvgl.slider.update: { id: ms_progress, value: 0 }
      - lvgl.label.update: { id: ms_np_pos, text: "0:00" }
      - script.execute:
          id: ms_send_input
          type: control
          arg: !lambda return command;
          value: 0

  - id: ms_render_toggles
    then:
      - lvgl.widget.update:
          id: ms_ic_shuffle_img
          image_recolor: !lambda "return id(ms_shuffle) ? lv_color_hex(0xFF6A1A) : lv_color_hex(0xEDEDED);"
      - if:
          condition:
            lambda: return id(ms_liked);
          then:
            - lvgl.widget.hide: ms_ic_heart_off_img
            - lvgl.widget.show: ms_ic_heart_on_img
          else:
            - lvgl.widget.hide: ms_ic_heart_on_img
            - lvgl.widget.show: ms_ic_heart_off_img

  - id: ms_vol_render
    then:
      - lvgl.label.update:
          id: ms_vol_value
          text: !lambda return to_string(id(ms_volume));
      - script.execute: ms_vol_seg_1_set
      - script.execute: ms_vol_seg_2_set
      - script.execute: ms_vol_seg_3_set
      - script.execute: ms_vol_seg_4_set
      - script.execute: ms_vol_seg_5_set
      - script.execute: ms_vol_seg_6_set
      - script.execute: ms_vol_seg_7_set
      - script.execute: ms_vol_seg_8_set
      - script.execute: ms_vol_seg_9_set
      - script.execute: ms_vol_seg_10_set
      - script.execute: ms_vol_seg_11_set
      - script.execute: ms_vol_seg_12_set
      - script.execute: ms_vol_seg_13_set
      - script.execute: ms_vol_seg_14_set
      - script.execute: ms_vol_seg_15_set
      - script.execute: ms_vol_seg_16_set

  # Backlight changed (here or from Home Assistant): adopt it as the user's level, unless
  # dim at night or the sleep clock is overriding it
  - id: ms_bri_sync
    then:
      - lambda: |-
          if (!id(ms_bri_override)) {
            auto values = id(display_backlight).remote_values;
            if (values.is_on()) id(ms_bri_user) = (int) roundf(values.get_brightness() * 100);
          }
          id(ms_brightness) = id(ms_bri_user);
      - lvgl.slider.update:
          id: ms_bri_slider
          value: !lambda return id(ms_brightness);
      - script.execute: ms_bri_render

  # Effective backlight: sleep clock 10 %, dim at night caps at 25 %, otherwise the user's level
  - id: ms_apply_backlight
    then:
      - lambda: |-
          bool night = false;
          auto now = id(ms_time).now();
          if (now.is_valid()) {
            int m = now.hour * 60 + now.minute;
            int a = id(ms_night_start), b = id(ms_night_end);
            night = a <= b ? (m >= a && m < b) : (m >= a || m < b);
          }
          if (!night) id(ms_dim_suspended) = false;
          int target = id(ms_bri_user);
          if (id(ms_sleep_minutes) > 0 && id(ms_idle)) target = 10;
          else if (id(ms_dim_night) && night && !id(ms_dim_suspended) && target > 25) target = 25;
          id(ms_bri_override) = target != id(ms_bri_user);
          id(ms_bri_target) = target;
      - if:
          condition:
            lambda: return id(ms_bri_target) != id(ms_bri_applied);
          then:
            - lambda: id(ms_bri_applied) = id(ms_bri_target);
            - light.turn_on:
                id: display_backlight
                brightness: !lambda return id(ms_bri_target) / 100.0;
                transition_length: 1s

  # Sleep timer tap (optimistic; the integration runs the real timer, D29)
  - id: ms_set_sleep
    parameters:
      minutes: int
    then:
      - lambda: |-
          id(ms_sleep_minutes) = minutes;
          id(ms_sleep_end_at) = millis() + (uint32_t) minutes * 60000;
      - script.execute: ms_sleep_render
      - script.execute:
          id: ms_send_input
          type: sleep
          arg: ""
          value: !lambda return minutes;
      - if:
          condition:
            lambda: return minutes > 0;
          then:
            - script.execute: { id: ms_set_awake, awake: false }
            - script.execute: ms_go_idle
          else:
            - script.execute: ms_apply_backlight

  - id: ms_sleep_render
    then:
      - lvgl.widget.update:
          id: ms_sleep_opt_0
          bg_color: !lambda "return id(ms_sleep_minutes) == 0 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_sleep_opt_0_lbl
          text_color: !lambda "return id(ms_sleep_minutes) == 0 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_sleep_opt_1
          bg_color: !lambda "return id(ms_sleep_minutes) == 15 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_sleep_opt_1_lbl
          text_color: !lambda "return id(ms_sleep_minutes) == 15 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_sleep_opt_2
          bg_color: !lambda "return id(ms_sleep_minutes) == 30 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_sleep_opt_2_lbl
          text_color: !lambda "return id(ms_sleep_minutes) == 30 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_sleep_opt_3
          bg_color: !lambda "return id(ms_sleep_minutes) == 60 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_sleep_opt_3_lbl
          text_color: !lambda "return id(ms_sleep_minutes) == 60 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_sleep_opt_4
          bg_color: !lambda "return id(ms_sleep_minutes) == 90 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_sleep_opt_4_lbl
          text_color: !lambda "return id(ms_sleep_minutes) == 90 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - if:
          condition:
            lambda: return id(ms_sleep_minutes) > 0;
          then:
            - lvgl.widget.show: ms_idle_sleep
          else:
            - lvgl.widget.hide: ms_idle_sleep

  - id: ms_dim_render
    then:
      - lvgl.widget.update:
          id: ms_dim_opt_0
          bg_color: !lambda "return id(ms_dim_night) ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_dim_opt_0_lbl
          text_color: !lambda "return id(ms_dim_night) ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_dim_opt_1
          bg_color: !lambda "return !id(ms_dim_night) ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
      - lvgl.label.update:
          id: ms_dim_opt_1_lbl
          text_color: !lambda "return !id(ms_dim_night) ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"

  - id: ms_clock_setting_render
    then:
      - lvgl.label.update:
          id: ms_set_clock
          text: !lambda |-
            if (id(ms_clock_after) <= 0) return std::string("NEVER >");
            return str_sprintf("%d MIN >", id(ms_clock_after));

  - id: ms_show_output
    then:
      - script.execute:
          id: ms_nav
          screen: 2
      - lvgl.page.show: ms_page_output
  - id: ms_bri_render
    then:
      - lvgl.label.update:
          id: ms_bri_value
          text: !lambda return to_string(id(ms_brightness));
      - script.execute: ms_bri_seg_1_set
      - script.execute: ms_bri_seg_2_set
      - script.execute: ms_bri_seg_3_set
      - script.execute: ms_bri_seg_4_set
      - script.execute: ms_bri_seg_5_set
      - script.execute: ms_bri_seg_6_set
      - script.execute: ms_bri_seg_7_set
      - script.execute: ms_bri_seg_8_set
      - script.execute: ms_bri_seg_9_set
      - script.execute: ms_bri_seg_10_set

  # Text and placeholders first, then images strictly one at a time (8 parallel tile
  # downloads rebooted the panel)
  - id: ms_refresh_rows
    then:
      - script.execute: ms_row_1_set
      - script.execute: ms_row_2_set
      - script.execute: ms_row_3_set
      - script.execute: ms_row_4_set
      - script.execute: ms_row_5_set
      - script.execute: ms_row_6_set
      - script.execute: ms_tile_1_set
      - script.execute: ms_tile_2_set
      - script.execute: ms_tile_3_set
      - script.execute: ms_tile_4_set
      - script.execute: ms_tile_5_set
      - script.execute: ms_tile_6_set
      - script.execute: ms_tile_7_set
      - script.execute: ms_tile_8_set
      - script.execute: ms_load_images

  # Restarted by every new page, so an old page's queue never delays the new one
  - id: ms_load_images
    mode: restart
    then:
      - script.execute: ms_row_1_load
      - script.wait: ms_row_1_load
      - script.execute: ms_row_2_load
      - script.wait: ms_row_2_load
      - script.execute: ms_row_3_load
      - script.wait: ms_row_3_load
      - script.execute: ms_row_4_load
      - script.wait: ms_row_4_load
      - script.execute: ms_row_5_load
      - script.wait: ms_row_5_load
      - script.execute: ms_row_6_load
      - script.wait: ms_row_6_load
      - script.execute: ms_tile_1_load
      - script.wait: ms_tile_1_load
      - script.execute: ms_tile_2_load
      - script.wait: ms_tile_2_load
      - script.execute: ms_tile_3_load
      - script.wait: ms_tile_3_load
      - script.execute: ms_tile_4_load
      - script.wait: ms_tile_4_load
      - script.execute: ms_tile_5_load
      - script.wait: ms_tile_5_load
      - script.execute: ms_tile_6_load
      - script.wait: ms_tile_6_load
      - script.execute: ms_tile_7_load
      - script.wait: ms_tile_7_load
      - script.execute: ms_tile_8_load
      - script.wait: ms_tile_8_load

  # Up next: open the page (PLAYING stays highlighted) and ask the integration for the queue
  - id: ms_show_queue
    then:
      - script.execute:
          id: ms_nav
          screen: 0
      - lvgl.page.show: ms_page_queue
      - script.execute:
          id: ms_send_input
          type: queue_view
          arg: ""
          value: 0

  - id: ms_q_refresh_rows
    then:
      - script.execute: ms_q_row_1_set
      - script.execute: ms_q_row_2_set
      - script.execute: ms_q_row_3_set
      - script.execute: ms_q_row_4_set
      - script.execute: ms_q_row_5_set

  # Boot splash: each line reflects a real milestone; the bar fills towards it
  - id: ms_splash_render
    then:
      - lvgl.label.update:
          id: ms_spl_0_status
          text: !lambda |-
            int step = id(ms_splash_step);
            if (step > 0) return std::string("OK");
            return std::string(step == 0 ? "..." : "--");
          text_color: !lambda |-
            int step = id(ms_splash_step);
            if (step > 0) return lv_color_hex(0xEDEDED);
            return step == 0 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_0_label
          text_color: !lambda |-
            int step = id(ms_splash_step);
            return step >= 0 ? lv_color_hex(0xA3A3A3) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_1_status
          text: !lambda |-
            int step = id(ms_splash_step);
            if (step > 1) return std::string("OK");
            return std::string(step == 1 ? "..." : "--");
          text_color: !lambda |-
            int step = id(ms_splash_step);
            if (step > 1) return lv_color_hex(0xEDEDED);
            return step == 1 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_1_label
          text_color: !lambda |-
            int step = id(ms_splash_step);
            return step >= 1 ? lv_color_hex(0xA3A3A3) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_2_status
          text: !lambda |-
            int step = id(ms_splash_step);
            if (step > 2) return std::string("OK");
            return std::string(step == 2 ? "..." : "--");
          text_color: !lambda |-
            int step = id(ms_splash_step);
            if (step > 2) return lv_color_hex(0xEDEDED);
            return step == 2 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_2_label
          text_color: !lambda |-
            int step = id(ms_splash_step);
            return step >= 2 ? lv_color_hex(0xA3A3A3) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_3_status
          text: !lambda |-
            int step = id(ms_splash_step);
            if (step > 3) return str_sprintf("%d FOUND", id(ms_splash_devices));
            return std::string(step == 3 ? "..." : "--");
          text_color: !lambda |-
            int step = id(ms_splash_step);
            if (step > 3) return lv_color_hex(0xEDEDED);
            return step == 3 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_3_label
          text_color: !lambda |-
            int step = id(ms_splash_step);
            return step >= 3 ? lv_color_hex(0xA3A3A3) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_4_status
          text: !lambda |-
            int step = id(ms_splash_step);
            if (step > 4) return std::string("OK");
            return std::string(step == 4 ? "..." : "--");
          text_color: !lambda |-
            int step = id(ms_splash_step);
            if (step > 4) return lv_color_hex(0xFF6A1A);
            return step == 4 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);
      - lvgl.label.update:
          id: ms_spl_4_label
          text_color: !lambda |-
            int step = id(ms_splash_step);
            return step >= 4 ? lv_color_hex(0xFF6A1A) : lv_color_hex(0x4A4A4A);

  - id: ms_splash_bar
    then:
      - script.execute: ms_spl_seg_1_set
      - script.execute: ms_spl_seg_2_set
      - script.execute: ms_spl_seg_3_set
      - script.execute: ms_spl_seg_4_set
      - script.execute: ms_spl_seg_5_set
      - script.execute: ms_spl_seg_6_set
      - script.execute: ms_spl_seg_7_set
      - script.execute: ms_spl_seg_8_set
      - script.execute: ms_spl_seg_9_set
      - script.execute: ms_spl_seg_10_set
      - script.execute: ms_spl_seg_11_set
      - script.execute: ms_spl_seg_12_set
      - script.execute: ms_spl_seg_13_set
      - script.execute: ms_spl_seg_14_set
      - script.execute: ms_spl_seg_15_set
      - script.execute: ms_spl_seg_16_set
      - script.execute: ms_spl_seg_17_set
      - script.execute: ms_spl_seg_18_set
      - script.execute: ms_spl_seg_19_set
      - script.execute: ms_spl_seg_20_set
      - script.execute: ms_spl_seg_21_set
      - script.execute: ms_spl_seg_22_set
      - script.execute: ms_spl_seg_23_set
      - script.execute: ms_spl_seg_24_set

  # READY: keep the finished splash up for 5 s, then go to PLAYING
  - id: ms_splash_finish
    mode: single
    then:
      - delay: 5s
      - script.execute: ms_splash_leave

  # Leave the splash now (end of the wait, or a tap)
  - id: ms_splash_leave
    mode: single
    then:
      - script.stop: ms_splash_finish
      - if:
          condition:
            lambda: return !id(ms_splash_done);
          then:
            - lambda: |-
                id(ms_splash_done) = true;
                id(ms_last_touch) = millis();
            - lvgl.widget.show: ms_navbar
            - script.execute: ms_update_offline
            - script.execute:
                id: ms_nav
                screen: 0

  # Search (design C, D25): full screen, nav bar hidden
  - id: ms_open_search
    then:
      - lvgl.widget.hide: ms_navbar
      - lvgl.page.show: ms_page_search
      - script.execute: ms_search_render_query
      - script.execute: ms_scope_render
      - script.execute: ms_kb_render

  - id: ms_close_search
    then:
      - script.stop: ms_search_debounce
      - script.execute:
          id: ms_nav
          screen: 1

  - id: ms_key
    parameters:
      ch: string
    then:
      - lambda: |-
          if (ch == "DEL") { if (!id(ms_query).empty()) id(ms_query).pop_back(); }
          else if (id(ms_query).size() < 18) id(ms_query) += ch;
      - script.execute: ms_search_render_query
      - script.execute: ms_search_debounce

  # Ask Spotify only after a 600 ms pause in typing (shared dev-mode quota)
  - id: ms_search_debounce
    mode: restart
    then:
      - delay: 600ms
      - script.execute:
          id: ms_send_input
          type: search
          arg: !lambda return id(ms_query);
          value: !lambda return id(ms_scope);

  - id: ms_search_render_query
    then:
      - lvgl.label.update:
          id: ms_s_query
          text: !lambda return id(ms_query);
      - if:
          condition:
            lambda: return id(ms_query).empty();
          then:
            - lvgl.widget.show: ms_s_placeholder
            - lvgl.widget.hide: ms_s_nomatch
            - lambda: |-
                id(ms_s_texts).clear();
                id(ms_s_tags).clear();
                id(ms_s_hits) = 0;
            - script.execute: ms_s_rows_render
          else:
            - lvgl.widget.hide: ms_s_placeholder

  - id: ms_scope_render
    then:
      - lvgl.widget.update:
          id: ms_scope_0
          bg_color: !lambda "return id(ms_scope) == 0 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
          border_color: !lambda "return id(ms_scope) == 0 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x2E2E2E);"
      - lvgl.label.update:
          id: ms_scope_0_lbl
          text_color: !lambda "return id(ms_scope) == 0 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_scope_1
          bg_color: !lambda "return id(ms_scope) == 1 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
          border_color: !lambda "return id(ms_scope) == 1 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x2E2E2E);"
      - lvgl.label.update:
          id: ms_scope_1_lbl
          text_color: !lambda "return id(ms_scope) == 1 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_scope_2
          bg_color: !lambda "return id(ms_scope) == 2 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
          border_color: !lambda "return id(ms_scope) == 2 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x2E2E2E);"
      - lvgl.label.update:
          id: ms_scope_2_lbl
          text_color: !lambda "return id(ms_scope) == 2 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_scope_3
          bg_color: !lambda "return id(ms_scope) == 3 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
          border_color: !lambda "return id(ms_scope) == 3 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x2E2E2E);"
      - lvgl.label.update:
          id: ms_scope_3_lbl
          text_color: !lambda "return id(ms_scope) == 3 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"
      - lvgl.widget.update:
          id: ms_scope_4
          bg_color: !lambda "return id(ms_scope) == 4 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x0A0A0A);"
          border_color: !lambda "return id(ms_scope) == 4 ? lv_color_hex(0xEDEDED) : lv_color_hex(0x2E2E2E);"
      - lvgl.label.update:
          id: ms_scope_4_lbl
          text_color: !lambda "return id(ms_scope) == 4 ? lv_color_hex(0x0A0A0A) : lv_color_hex(0x8A8A8A);"

  - id: ms_kb_render
    then:
      - lvgl.label.update:
          id: ms_key_r1_0
          text: !lambda 'return std::string(id(ms_kb_num) ? "1" : "Q");'
      - lvgl.label.update:
          id: ms_key_r1_1
          text: !lambda 'return std::string(id(ms_kb_num) ? "2" : "W");'
      - lvgl.label.update:
          id: ms_key_r1_2
          text: !lambda 'return std::string(id(ms_kb_num) ? "3" : "E");'
      - lvgl.label.update:
          id: ms_key_r1_3
          text: !lambda 'return std::string(id(ms_kb_num) ? "4" : "R");'
      - lvgl.label.update:
          id: ms_key_r1_4
          text: !lambda 'return std::string(id(ms_kb_num) ? "5" : "T");'
      - lvgl.label.update:
          id: ms_key_r1_5
          text: !lambda 'return std::string(id(ms_kb_num) ? "6" : "Y");'
      - lvgl.label.update:
          id: ms_key_r1_6
          text: !lambda 'return std::string(id(ms_kb_num) ? "7" : "U");'
      - lvgl.label.update:
          id: ms_key_r1_7
          text: !lambda 'return std::string(id(ms_kb_num) ? "8" : "I");'
      - lvgl.label.update:
          id: ms_key_r1_8
          text: !lambda 'return std::string(id(ms_kb_num) ? "9" : "O");'
      - lvgl.label.update:
          id: ms_key_r1_9
          text: !lambda 'return std::string(id(ms_kb_num) ? "0" : "P");'
      - lvgl.label.update:
          id: ms_key_mode
          text: !lambda 'return std::string(id(ms_kb_num) ? "ABC" : "123");'

  - id: ms_s_rows_render
    then:
      - if:
          condition:
            lambda: return id(ms_s_texts).size() > 0;
          then:
            - lvgl.label.update:
                id: ms_s_row_1_tag
                text: !lambda 'return id(ms_s_tags).size() > 0 ? id(ms_s_tags)[0] : std::string("");'
            - lvgl.label.update:
                id: ms_s_row_1_text
                text: !lambda return id(ms_s_texts)[0];
            - lvgl.widget.show: ms_s_row_1
          else:
            - lvgl.widget.hide: ms_s_row_1
      - if:
          condition:
            lambda: return id(ms_s_texts).size() > 1;
          then:
            - lvgl.label.update:
                id: ms_s_row_2_tag
                text: !lambda 'return id(ms_s_tags).size() > 1 ? id(ms_s_tags)[1] : std::string("");'
            - lvgl.label.update:
                id: ms_s_row_2_text
                text: !lambda return id(ms_s_texts)[1];
            - lvgl.widget.show: ms_s_row_2
          else:
            - lvgl.widget.hide: ms_s_row_2
      - if:
          condition:
            lambda: return id(ms_s_texts).size() > 2;
          then:
            - lvgl.label.update:
                id: ms_s_row_3_tag
                text: !lambda 'return id(ms_s_tags).size() > 2 ? id(ms_s_tags)[2] : std::string("");'
            - lvgl.label.update:
                id: ms_s_row_3_text
                text: !lambda return id(ms_s_texts)[2];
            - lvgl.widget.show: ms_s_row_3
          else:
            - lvgl.widget.hide: ms_s_row_3
      - lvgl.label.update:
          id: ms_s_hits_lbl
          text: !lambda return str_sprintf("%02d HITS >", id(ms_s_hits));

  - id: ms_refresh_device_rows
    then:
      - script.execute: ms_device_row_1_set
      - script.execute: ms_device_row_2_set
      - script.execute: ms_device_row_3_set
      - script.execute: ms_device_row_4_set
      - script.execute: ms_device_row_5_set

  # Idle clock
  - id: ms_clock_render
    then:
      - if:
          condition:
            lambda: return id(ms_time).now().is_valid();
          then:
            - lvgl.label.update:
                id: ms_idle_hh
                text: !lambda return id(ms_time).now().strftime("%H");
            - lvgl.label.update:
                id: ms_idle_mm
                text: !lambda return id(ms_time).now().strftime("%M");
            - lvgl.label.update:
                id: ms_idle_date
                text: !lambda |-
                  std::string s = id(ms_time).now().strftime("%a %d %b");
                  for (auto &c : s) c = toupper(c);
                  return s;

  - id: ms_go_idle
    then:
      - lambda: id(ms_idle) = true;
      - lvgl.widget.hide: ms_busy
      - script.execute: ms_clock_render
      - lvgl.widget.hide: ms_navbar
      - lvgl.page.show: ms_page_idle
      - script.execute: ms_apply_backlight

  - id: ms_wake
    then:
      - lambda: |-
          id(ms_idle) = false;
          id(ms_last_touch) = millis();
      - script.execute: ms_apply_backlight
      - lvgl.widget.show: ms_navbar
      - script.execute: { id: ms_nav, screen: 0 }
      - script.execute: { id: ms_set_awake, awake: true }

# Segment bars are drawn by scripts, so draw them once after boot
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: id(ms_brightness) = id(ms_bri_user);
        - lvgl.slider.update:
            id: ms_bri_slider
            value: !lambda return id(ms_brightness);
        - script.execute: ms_bri_render
        - script.execute: ms_vol_render
        - script.execute: ms_sleep_render
        - script.execute: ms_dim_render
        - script.execute: ms_clock_setting_render
        - script.execute: ms_apply_backlight

# Brightness bar follows the backlight, also when it is changed from Home Assistant
light:
  - id: !extend display_backlight
    on_state:
      - script.execute: ms_bri_sync

touchscreen:
  - id: !extend my_touchscreen
    on_touch:
      - lambda: id(ms_last_touch) = millis();
      - script.execute:
          id: ms_set_awake
          awake: true
    # A slider whose press is lost (finger slid off) gets no on_release; never leave its flag stuck
    on_release:
      - lambda: |-
          if (id(ms_vol_drag)) {
            id(ms_vol_drag) = false;
            id(ms_vol_hold_until) = millis() + 4000;
          }
          id(ms_bri_drag) = false;
          id(ms_seeking) = false;

# -------------------------------------------
# Inbound: API actions called by the integration
# -------------------------------------------
api:
  # Other API clients (e.g. the ESPHome dashboard log viewer) connect and disconnect too;
  # only Home Assistant counts for the banner and the hello.
  on_client_connected:
    - if:
        condition:
          lambda: return client_info.find("Home Assistant") != std::string::npos;
        then:
          - script.execute: ms_send_hello
    - script.execute: ms_update_offline
  on_client_disconnected:
    - script.execute: ms_update_offline

  actions:
    # state: playing | paused | idle
    - action: show_now_playing
      variables:
        title: string
        artist: string
        context: string
        device: string
        art_url: string
        state: string
        position_ms: int
        duration_ms: int
        volume: int
        shuffle: bool
        liked: bool
      then:
        - lambda: |-
            id(ms_np_received) = true;
            id(ms_np_idle) = (state == "idle");
            // Play/pause and next/previous are shown at tap; ignore Spotify's stale
            // state/position for 4 s (a new track title always gets through)
            bool hold_play = (int32_t) (millis() - id(ms_play_hold_until)) < 0;
            bool hold_pos = title == id(ms_np_cur_title) && (int32_t) (millis() - id(ms_pos_hold_until)) < 0;
            if (!hold_play) id(ms_playing) = (state == "playing");
            id(ms_dur_ms) = duration_ms;
            if (!hold_play && !hold_pos) {
              id(ms_pos_ms) = position_ms;
              id(ms_pos_at) = millis();
            }
            id(ms_np_cur_title) = title;
        - lvgl.label.update:
            id: ms_np_title
            text: !lambda |-
              return (state == "idle" || title.empty()) ? std::string("Nothing playing") : title;
        # One or two title lines (LVGL has no "max lines"): ~17 glyphs of 28 px Plex Sans fit in
        # the 276 px column; the artist sits directly below either way
        - lvgl.widget.update:
            id: ms_np_title
            height: !lambda |-
              const std::string &t = (state == "idle" || title.empty()) ? std::string("Nothing playing") : title;
              size_t glyphs = 0;
              for (unsigned char c : t) if ((c & 0xC0) != 0x80) glyphs++;
              return glyphs > 17 ? 72 : 37;
        - lvgl.label.update:
            id: ms_np_artist
            text: !lambda |-
              return state == "idle" ? std::string("Pick something in Library") : artist;
        - lvgl.label.update:
            id: ms_np_context
            text: !lambda return context;
        - lvgl.label.update:
            id: ms_np_device
            text: !lambda |-
              return device.empty() ? std::string("NO SPEAKER") : device;
        - lvgl.label.update:
            id: ms_idle_device
            text: !lambda return device;
        - lvgl.label.update:
            id: ms_idle_track
            text: !lambda |-
              if (state == "idle" || title.empty()) return std::string("Nothing playing");
              return artist.empty() ? title : title + " \xE2\x80\x94 " + artist;
        - script.execute: ms_render_play
        # Shuffle/like: a tap shows the new state at once; Spotify's (stale) value is
        # ignored for 4 s, after which the integration re-sends the real state
        - lambda: |-
            if ((int32_t) (millis() - id(ms_shuffle_hold_until)) >= 0) id(ms_shuffle) = shuffle;
            if ((int32_t) (millis() - id(ms_like_hold_until)) >= 0) id(ms_liked) = liked;
        - script.execute: ms_render_toggles
        - if:
            condition:
              # Ignore Spotify's stale volume while dragging and for 4 s after release
              lambda: return !id(ms_vol_drag) && (int32_t) (millis() - id(ms_vol_hold_until)) >= 0;
            then:
              - lambda: id(ms_volume) = volume;
              - lvgl.slider.update:
                  id: ms_vol_slider
                  value: !lambda return volume;
              - script.execute: ms_vol_render
        - if:
            condition:
              lambda: return art_url != id(ms_art_url);
            then:
              - lambda: id(ms_art_url) = art_url;
              - if:
                  condition:
                    lambda: return art_url.empty();
                  then:
                    - lvgl.widget.hide: ms_art_img
                  else:
                    - online_image.set_url:
                        id: ms_art
                        url: !lambda return art_url;

    # grid: Albums tab cover grid (8 tiles) instead of the 6-row list
    - action: show_page
      variables:
        title: string
        tab: int
        page: int
        pages: int
        can_back: bool
        grid: bool
        now_index: int
        nums: string[]
        titles: string[]
        subtitles: string[]
        counts: string[]
        thumbs: string[]
      then:
        - lambda: |-
            id(ms_grid) = grid;
            id(ms_now_index) = now_index;
            id(ms_nums) = nums;
            id(ms_titles) = titles;
            id(ms_subtitles) = subtitles;
            id(ms_counts) = counts;
            id(ms_thumbs) = thumbs;
        - lvgl.label.update:
            id: ms_lib_title
            text: !lambda return title;
        - if:
            condition:
              lambda: return can_back;
            then:
              - lvgl.widget.hide: ms_lib_src_row
              - lvgl.widget.show: ms_lib_back_row
            else:
              - lvgl.widget.hide: ms_lib_back_row
              - lvgl.widget.show: ms_lib_src_row
        - script.execute:
            id: ms_tabs_render
            tab: !lambda return tab;
        - lvgl.label.update:
            id: ms_pg_n
            text: !lambda return str_sprintf("%02d", (int) page);
        - lvgl.label.update:
            id: ms_pg_c
            text: !lambda return str_sprintf("%02d", (int) pages);
        - lvgl.widget.update:
            id: ms_pg_up_img
            image_recolor: !lambda "return page <= 1 ? lv_color_hex(0x3A3A3A) : lv_color_hex(0xEDEDED);"
        - lvgl.widget.update:
            id: ms_pg_dn_img
            image_recolor: !lambda "return page >= pages ? lv_color_hex(0x3A3A3A) : lv_color_hex(0xEDEDED);"
        - if:
            condition:
              lambda: return titles.empty();
            then:
              - lvgl.widget.show: ms_lib_empty
            else:
              - lvgl.widget.hide: ms_lib_empty
        - if:
            condition:
              lambda: return grid;
            then:
              - lvgl.widget.hide: ms_lib_list
              - lvgl.widget.show: ms_lib_grid
            else:
              - lvgl.widget.hide: ms_lib_grid
              - lvgl.widget.show: ms_lib_list
        - script.execute: ms_refresh_rows

    # Up next (read-only Spotify queue), 5 rows per page
    - action: show_queue
      variables:
        context: string
        now_title: string
        now_artist: string
        page: int
        pages: int
        nums: string[]
        titles: string[]
        artists: string[]
        durations: string[]
      then:
        - lambda: |-
            id(ms_q_nums) = nums;
            id(ms_q_titles) = titles;
            id(ms_q_artists) = artists;
            id(ms_q_durations) = durations;
        - lvgl.label.update:
            id: ms_q_context
            text: !lambda |-
              return context.empty() ? std::string("") : std::string("SRC: ") + context;
        - lvgl.label.update:
            id: ms_q_now
            text: !lambda |-
              if (now_title.empty()) return std::string("Nothing playing");
              return now_artist.empty() ? now_title : now_title + " \xE2\x80\x94 " + now_artist;
        - lvgl.label.update:
            id: ms_q_pg_n
            text: !lambda return str_sprintf("%02d", (int) page);
        - lvgl.label.update:
            id: ms_q_pg_c
            text: !lambda return str_sprintf("%02d", (int) pages);
        - lvgl.widget.update:
            id: ms_q_pg_up_img
            image_recolor: !lambda "return page <= 1 ? lv_color_hex(0x3A3A3A) : lv_color_hex(0xEDEDED);"
        - lvgl.widget.update:
            id: ms_q_pg_dn_img
            image_recolor: !lambda "return page >= pages ? lv_color_hex(0x3A3A3A) : lv_color_hex(0xEDEDED);"
        - if:
            condition:
              lambda: return titles.empty();
            then:
              - lvgl.widget.show: ms_q_empty
            else:
              - lvgl.widget.hide: ms_q_empty
        - script.execute: ms_q_refresh_rows

    # SETUP values owned by Home Assistant (night hours, default speaker, sleep timer)
    - action: show_settings
      variables:
        night_start_min: int
        night_end_min: int
        default_device: string
        version: string
        sleep_minutes: int
        sleep_remaining_s: int
      then:
        - lambda: |-
            id(ms_night_start) = night_start_min;
            id(ms_night_end) = night_end_min;
            id(ms_sleep_minutes) = sleep_minutes;
            id(ms_sleep_end_at) = millis() + (uint32_t) sleep_remaining_s * 1000;
        - lvgl.label.update:
            id: ms_set_night
            text: !lambda |-
              return str_sprintf("%02d:%02d - %02d:%02d", (int) night_start_min / 60, (int) night_start_min % 60,
                                 (int) night_end_min / 60, (int) night_end_min % 60);
        - lvgl.label.update:
            id: ms_set_default
            text: !lambda |-
              return default_device.empty() ? std::string("-") : default_device;
        - lvgl.label.update:
            id: ms_set_version
            text: !lambda return version;
        - script.execute: ms_sleep_render
        - script.execute: ms_apply_backlight

    # Search results: top 3 with LVGL recolor markup (#FF6A1A match#), hits across types
    - action: show_search
      variables:
        query: string
        hits: int
        tags: string[]
        texts: string[]
      then:
        - if:
            condition:
              # ignore answers to an older query
              lambda: return query == id(ms_query);
            then:
              - lambda: |-
                  id(ms_s_hits) = hits;
                  id(ms_s_tags) = tags;
                  id(ms_s_texts) = texts;
              - script.execute: ms_s_rows_render
              - if:
                  condition:
                    lambda: return !query.empty() && texts.empty();
                  then:
                    - lvgl.widget.show: ms_s_nomatch
                  else:
                    - lvgl.widget.hide: ms_s_nomatch

    - action: show_devices
      variables:
        names: string[]
        active: int
      then:
        - lambda: |-
            id(ms_devices) = names;
            id(ms_active_device) = active;
            id(ms_splash_devices) = names.size();
        - lvgl.label.update:
            id: ms_set_output
            text: !lambda |-
              if (active < 0 || active >= (int) names.size()) return std::string("NONE >");
              std::string name = names[active];
              for (auto &c : name) c = toupper(c);
              return name + " >";
        - if:
            condition:
              lambda: return names.empty();
            then:
              - lvgl.widget.show: ms_devices_empty
            else:
              - lvgl.widget.hide: ms_devices_empty
        - script.execute: ms_refresh_device_rows

    - action: set_busy
      variables:
        busy: bool
      then:
        # Background work while the idle clock or splash is up needs no spinner
        - if:
            condition:
              lambda: return busy && !id(ms_idle) && id(ms_splash_done);
            then:
              - lvgl.widget.show: ms_busy
            else:
              - lvgl.widget.hide: ms_busy

    - action: show_toast
      variables:
        message: string
      then:
        - script.execute:
            id: ms_toast
            message: !lambda return message;

    # screen: now | browse | devices
    - action: show_screen
      variables:
        screen: string
      then:
        - if:
            condition:
              lambda: return id(ms_idle);
            then:
              - script.execute: ms_wake
        - script.execute:
            id: ms_nav
            screen: !lambda |-
              return screen == "browse" ? 1 : screen == "devices" ? 2 : 0;
        - if:
            condition:
              lambda: return screen == "devices";
            then:
              - lvgl.page.show: ms_page_output

# -------------------------------------------
# Timers
# -------------------------------------------
interval:
  # Clock screen after N minutes without touch (SETUP; NEVER = off, but 2 min while a sleep timer runs)
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ms_splash_done) || id(ms_idle)) return false;
              uint32_t limit = id(ms_clock_after) > 0 ? (uint32_t) id(ms_clock_after) * 60000u
                             : (id(ms_sleep_minutes) > 0 ? 120000u : 0u);
              return limit > 0 && millis() - id(ms_last_touch) > limit;
          then:
            - script.execute: { id: ms_set_awake, awake: false }
            - script.execute: ms_go_idle
  # Sleep countdown on the idle clock
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(ms_idle) && id(ms_sleep_minutes) > 0;
          then:
            - lvgl.label.update:
                id: ms_idle_sleep
                text: !lambda |-
                  int32_t left = (int32_t) (id(ms_sleep_end_at) - millis()) / 1000;
                  if (left < 0) left = 0;
                  return str_sprintf("SLEEP %d:%02d", left / 60, left % 60);
  # Night starts/ends: re-evaluate the backlight
  - interval: 60s
    then:
      - script.execute: ms_apply_backlight
  # Boot splash: advance milestones and animate the bar (150 ms per segment)
  - interval: 150ms
    then:
      - if:
          condition:
            lambda: return !id(ms_splash_done);
          then:
            - lambda: |-
                int step = 1;  // ESPHome core is up once this runs
                if (step == 1 && wifi::global_wifi_component->is_connected()) step = 2;
                if (step == 2 && api::global_api_server->is_connected_with_state_subscription()) step = 3;
                if (step == 3 && id(ms_splash_devices) >= 0) step = 4;
                if (step == 4 && id(ms_np_received)) step = 5;
                static const int target[] = {0, 5, 11, 17, 22, 24};
                if (id(ms_splash_seg) < target[step]) id(ms_splash_seg)++;
                id(ms_splash_pct) = id(ms_splash_seg) * 100 / 24;
                if (step != id(ms_splash_step)) {
                  id(ms_splash_step) = step;
                  id(ms_splash_render).execute();
                }
            - script.execute: ms_splash_bar
            - if:
                condition:
                  and:
                    - lambda: return id(ms_splash_step) >= 5 && id(ms_splash_seg) >= 24;
                    # Start the 5 s hold once (the ticker runs every 150 ms)
                    - not:
                        script.is_running: ms_splash_finish
                then:
                  - script.execute: ms_splash_finish
  # Safety net for the offline banner (HA can subscribe a moment after connecting)
  - interval: 10s
    then:
      - script.execute: ms_update_offline
      - if:
          condition:
            lambda: return id(ms_idle);
          then:
            - script.execute: ms_clock_render
  # Progress: interpolate locally between updates
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: return id(ms_dur_ms) > 0;
          then:
            - lvgl.label.update:
                id: ms_np_pos
                text: !lambda |-
                  int32_t pos = id(ms_pos_ms);
                  if (id(ms_playing)) pos += millis() - id(ms_pos_at);
                  if (pos > id(ms_dur_ms)) pos = id(ms_dur_ms);
                  int s = pos / 1000;
                  return str_sprintf("%d:%02d", s / 60, s % 60);
            - lvgl.label.update:
                id: ms_np_dur
                text: !lambda |-
                  int s = id(ms_dur_ms) / 1000;
                  return str_sprintf("/ %d:%02d", s / 60, s % 60);
            - lvgl.widget.update:
                id: ms_np_dur
                x: !lambda |-
                  int32_t pos = id(ms_pos_ms);
                  if (id(ms_playing)) pos += millis() - id(ms_pos_at);
                  if (pos > id(ms_dur_ms)) pos = id(ms_dur_ms);
                  int s = pos / 1000;
                  return (int) str_sprintf("%d:%02d", s / 60, s % 60).size() * 24 + 8;
            - if:
                condition:
                  lambda: return !id(ms_seeking);
                then:
                  - lvgl.slider.update:
                      id: ms_progress
                      value: !lambda |-
                        int32_t pos = id(ms_pos_ms);
                        if (id(ms_playing)) pos += millis() - id(ms_pos_at);
                        if (pos > id(ms_dur_ms)) pos = id(ms_dur_ms);
                        return (int) ((int64_t) pos * 1000 / id(ms_dur_ms));
          else:
            - lvgl.label.update: { id: ms_np_pos, text: "0:00" }
            - lvgl.label.update: { id: ms_np_dur, text: "" }
            - lvgl.slider.update: { id: ms_progress, value: 0 }

# -------------------------------------------
# Screens
# -------------------------------------------
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  top_layer:
    widgets:
      # Bottom navigation: PLAYING / LIBRARY / SETUP with a 3 px accent bar on the active tab
      - obj:
          id: ms_navbar
          hidden: true  # shown when the boot splash finishes
          align: BOTTOM_MID
          width: 480
          height: 64
          bg_color: ms_c_bg
          bg_opa: COVER
          border_width: 1
          border_side: [TOP]
          border_color: ms_c_line
          layout:
            type: flex
            flex_flow: ROW
            pad_row: 0
            pad_column: 0
          widgets:
            - button:
                width: 10
                flex_grow: 1
                height: 100%
                border_width: 1
                border_side: [RIGHT]
                border_color: ms_c_line
                on_click:
                  - script.execute:
                      id: ms_nav
                      screen: 0
                widgets:
                  - obj:
                      id: ms_nav_ind_0
                      align: TOP_MID
                      width: 100%
                      height: 3
                      bg_color: ms_c_accent
                      bg_opa: COVER
                      clickable: false
                  - label:
                      id: ms_nav_lbl_0
                      text: "PLAYING"
                      align: CENTER
                      text_font: ms_mono12
                      text_color: ms_c_fg
                      text_letter_space: 1
            - button:
                width: 10
                flex_grow: 1
                height: 100%
                border_width: 1
                border_side: [RIGHT]
                border_color: ms_c_line
                on_click:
                  - script.execute:
                      id: ms_nav
                      screen: 1
                widgets:
                  - obj:
                      id: ms_nav_ind_1
                      align: TOP_MID
                      width: 100%
                      height: 3
                      bg_color: ms_c_accent
                      bg_opa: COVER
                      clickable: false
                      hidden: true
                  - label:
                      id: ms_nav_lbl_1
                      text: "LIBRARY"
                      align: CENTER
                      text_font: ms_mono12
                      text_color: ms_c_dim
                      text_letter_space: 1
            - button:
