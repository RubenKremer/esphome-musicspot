                              on_press:
                                - lambda: id(ms_vol_drag) = true;
                              on_value:
                                - if:
                                    condition:
                                      lambda: return id(ms_vol_drag);
                                    then:
                                      - lambda: id(ms_volume) = (int) x;
                                      - script.execute: ms_vol_render
                              on_release:
                                - lambda: |-
                                    id(ms_vol_drag) = false;
                                    id(ms_vol_hold_until) = millis() + 4000;
                                - script.execute:
