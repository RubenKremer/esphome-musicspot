                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 8 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 9 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 10 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 11 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 12 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 13 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 14 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 15 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 16 } }
                          # Invisible slider on top of the segments takes the touch
                          - slider:
                              id: ms_vol_slider
                              width: 100%
                              height: 100%
                              min_value: 0
                              max_value: 100
                              value: 0
                              bg_opa: TRANSP
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_opa: TRANSP
                              # on_value also fires for updates from Home Assistant, so only a
                              # press marks the bar as being dragged
                              on_press:
                                - lambda: id(ms_vol_drag) = true;
                              on_value:
                                - if:
                                    condition:
                                      lambda: return id(ms_vol_drag);
                                    then:
                                      - lambda: id(ms_volume) = (int) x;
