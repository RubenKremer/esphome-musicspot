                    - button:
                        width: 10
                        flex_grow: 1
                        height: 100%
                        on_click:
                          - lambda: |-
                              id(ms_liked) = !id(ms_liked);
                              id(ms_like_hold_until) = millis() + 4000;
                          - script.execute: ms_render_toggles
                          - script.execute: { id: ms_send_input, type: control, arg: like, value: 0 }
                        widgets:
                          - image: { id: ms_ic_heart_off_img, src: ms_ic_heart_outline, align: CENTER, styles: ms_st_icon }
                          - image:
                              id: ms_ic_heart_on_img
                              src: ms_ic_heart
                              align: CENTER
                              hidden: true
                              image_recolor: ms_c_accent
                              image_recolor_opa: COVER
              # Volume: 16 segments + value + QUEUE
              - obj:
                  width: 100%
                  height: 28
                  scrollable: false
