            pad_right: 18
            pad_bottom: 14
            scrollable: false
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 0
              pad_column: 0
            widgets:
              # Header: source switch + search at a tab root; BACK + title inside a folder
              - obj:
                  width: 100%
                  height: 44
                  scrollable: false
                  widgets:
                    - obj:
                        id: ms_lib_src_row
                        width: 100%
                        height: 44
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          flex_align_track: CENTER
                          pad_column: 10
                          pad_row: 0
                        widgets:
                          - label: { text: "SRC", styles: ms_st_label }
                          - obj:
                              width: 10
                              flex_grow: 1
                              height: 40
                              styles: ms_st_box
                              scrollable: false
                              layout:
                                type: flex
                                flex_flow: ROW
                                pad_row: 0
                                pad_column: 0
                              widgets:
                                - obj:
                                    width: 10
                                    flex_grow: 1
                                    height: 100%
                                    bg_color: 0x262626  # selected source (design C v1.1)
                                    bg_opa: COVER
                                    layout:
                                      type: flex
                                      flex_flow: ROW
                                      flex_align_main: CENTER
                                      flex_align_cross: CENTER
                                      flex_align_track: CENTER
                                      pad_column: 8
                                      pad_row: 0
                                    widgets:
                                      - obj: { width: 6, height: 6, bg_color: ms_c_spotify, bg_opa: COVER }
                                      - label:
                                          text: "SPOTIFY"
                                          text_font: ms_mono12
                                          text_color: ms_c_fg
                                          text_letter_space: 1
                                # Empty placeholder for Music Assistant (D19, Phase 8)
                                - obj:
                                    width: 10
                                    flex_grow: 1
                                    height: 100%
                                    border_width: 1
                                    border_side: [LEFT]
                                    border_color: ms_c_line
                          - button:
                              width: 44
                              height: 40
                              styles: ms_st_box
                              on_click:
                                - script.execute: ms_open_search
                              widgets:
                                - image: { src: ms_ic_search, align: CENTER, styles: ms_st_icon }
                    - obj:
                        id: ms_lib_back_row
                        hidden: true
                        width: 100%
                        height: 44
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          flex_align_track: CENTER
                          pad_column: 12
                          pad_row: 0
                        widgets:
                          - button:
                              height: 40
                              width: SIZE_CONTENT
                              pad_left: 12
                              pad_right: 12
                              styles: ms_st_box
                              layout:
                                type: flex
                                flex_flow: ROW
                                flex_align_cross: CENTER
                                flex_align_track: CENTER
                                pad_column: 6
                                pad_row: 0
                              on_click:
                                - script.execute: { id: ms_send_input, type: back, arg: "", value: 0 }
                              widgets:
                                - image: { src: ms_ic_back, styles: ms_st_icon }
                                - label:
                                    text: "BACK"
                                    text_font: ms_mono12
                                    text_color: ms_c_fg
                                    text_letter_space: 1
                          - label:
                              id: ms_lib_title
                              text: ""
                              width: 10
                              flex_grow: 1
                              long_mode: DOT
                              height: 21  # one line, so DOT truncates instead of wrapping
                              text_font: ms_sans16
                              text_color: ms_c_fg
              # Tabs (D21)
              - obj:
                  width: 100%
                  height: 44
                  border_width: 1
                  border_side: [BOTTOM]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_column: 18
                    pad_row: 0
                  widgets:
                    - button:
                        id: ms_tab_0
                        width: 80
                        height: 44
                        border_color: ms_c_accent
                        border_side: [BOTTOM]
                        border_width: 2
                        on_click:
                          - script.execute:
                              id: ms_tabs_render
                              tab: 0
                          - script.execute:
                              id: ms_send_input
                              type: tab
                              arg: ""
                              value: 0
                        widgets:
                          - label:
                              id: ms_tab_0_lbl
                              text: "PLAYLISTS"
                              align: LEFT_MID
                              text_font: ms_mono12
                              text_color: ms_c_fg
                              text_letter_space: 1
                    - button:
                        id: ms_tab_1
                        width: 56
                        height: 44
                        border_color: ms_c_accent
                        border_side: [BOTTOM]
                        border_width: 0
                        on_click:
                          - script.execute:
                              id: ms_tabs_render
                              tab: 1
                          - script.execute:
                              id: ms_send_input
                              type: tab
                              arg: ""
                              value: 1
                        widgets:
                          - label:
                              id: ms_tab_1_lbl
                              text: "ALBUMS"
                              align: LEFT_MID
                              text_font: ms_mono12
                              text_color: ms_c_dim
                              text_letter_space: 1
                    - button:
                        id: ms_tab_2
                        width: 64
                        height: 44
                        border_color: ms_c_accent
                        border_side: [BOTTOM]
                        border_width: 0
                        on_click:
                          - script.execute:
                              id: ms_tabs_render
                              tab: 2
                          - script.execute:
                              id: ms_send_input
                              type: tab
                              arg: ""
                              value: 2
                        widgets:
                          - label:
                              id: ms_tab_2_lbl
                              text: "ARTISTS"
                              align: LEFT_MID
                              text_font: ms_mono12
                              text_color: ms_c_dim
                              text_letter_space: 1
                    - button:
                        id: ms_tab_3
                        width: 56
                        height: 44
                        border_color: ms_c_accent
                        border_side: [BOTTOM]
                        border_width: 0
                        on_click:
                          - script.execute:
                              id: ms_tabs_render
                              tab: 3
                          - script.execute:
                              id: ms_send_input
                              type: tab
                              arg: ""
                              value: 3
                        widgets:
                          - label:
                              id: ms_tab_3_lbl
                              text: "RECENT"
                              align: LEFT_MID
                              text_font: ms_mono12
                              text_color: ms_c_dim
                              text_letter_space: 1
              # Body: list or grid + pager column
              - obj:
                  width: 100%
                  height: 10
                  flex_grow: 1
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_row: 0
                    pad_column: 0
                  widgets:
                    - obj:
                        id: ms_lib_list
                        width: 10
                        flex_grow: 1
                        height: 100%
                        pad_right: 14
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: COLUMN
                          pad_row: 0
                          pad_column: 0
                        widgets:
                          - label:
                              id: ms_lib_empty
                              text: "Waiting for Home Assistant"
                              pad_top: 14
                              text_font: ms_sans14
                              text_color: ms_c_dim
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 1 } }
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 2 } }
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 3 } }
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 4 } }
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 5 } }
                          - button: !include { file: widgets/list_row.yaml, vars: { n: 6 } }
                    - obj:
                        id: ms_lib_grid
                        hidden: true
                        width: 10
                        flex_grow: 1
                        height: 100%
                        pad_top: 14
                        pad_right: 14
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW_WRAP
                          pad_row: 14
                          pad_column: 8  # 4 x 84 + 3 x 8 = 360 of 366 px: leaves slack so 4 columns never wrap to 3
                        widgets:
                          - button: !include { file: widgets/tile.yaml, vars: { n: 1 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 2 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 3 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 4 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 5 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 6 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 7 } }
                          - button: !include { file: widgets/tile.yaml, vars: { n: 8 } }
                    - obj:
                        width: 64
                        height: 100%
                        border_width: 1
                        border_side: [LEFT, BOTTOM]
                        border_color: ms_c_line
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: COLUMN
                          pad_row: 0
                          pad_column: 0
                        widgets:
                          - button:
                              width: 100%
                              height: 10
                              flex_grow: 1
                              border_width: 1
                              border_side: [BOTTOM]
                              border_color: ms_c_line
                              on_click:
                                - script.execute: { id: ms_send_input, type: page, arg: "", value: -1 }
                              widgets:
                                - image: { id: ms_pg_up_img, src: ms_ic_up, align: CENTER, styles: ms_st_icon }
                          - obj:
                              width: 100%
                              height: 80
                              border_width: 1
                              border_side: [BOTTOM]
                              border_color: ms_c_line
                              layout:
                                type: flex
                                flex_flow: COLUMN
                                flex_align_main: CENTER
                                flex_align_cross: CENTER
                                flex_align_track: CENTER
                                pad_row: 8
                                pad_column: 0
                              widgets:
                                - label: { id: ms_pg_n, text: "01", text_font: ms_mono16, text_color: ms_c_fg }
                                - obj: { width: 24, height: 1, bg_color: ms_c_line, bg_opa: COVER }
                                - label: { id: ms_pg_c, text: "01", text_font: ms_mono12, text_color: ms_c_dim }
                          - button:
                              width: 100%
                              height: 10
                              flex_grow: 1
                              on_click:
                                - script.execute: { id: ms_send_input, type: page, arg: "", value: 1 }
                              widgets:
                                - image: { id: ms_pg_dn_img, src: ms_ic_down, align: CENTER, styles: ms_st_icon }

    # ---------------- SETUP (design C settings list; scrolls) ----------------
    - id: ms_page_setup
      bg_color: ms_c_bg
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            width: 480
            height: 415
            align: TOP_MID
            pad_top: 14
            pad_left: 18
            pad_right: 18
            pad_bottom: 14
            scrollable: true
            scrollbar_mode: AUTO
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 0
              pad_column: 0
            widgets:
              - label:
                  text: "SETUP / DEVICE"
                  height: 32
                  pad_top: 10
                  styles: ms_st_label
              # Brightness (10 segments)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Brightness", width: 120, text_font: ms_sans16, text_color: ms_c_fg }
                    - obj:
                        width: 10
                        flex_grow: 1
                        height: 18
                        scrollable: false
                        widgets:
                          - obj:
                              width: 100%
                              height: 100%
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: ROW
                                pad_column: 3
                                pad_row: 0
                              widgets:
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 1 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 2 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 3 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 4 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 5 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 6 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 7 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 8 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 9 } }
                              - obj: !include { file: widgets/segment.yaml, vars: { group: bri, n: 10 } }
                          - slider:
                              id: ms_bri_slider
                              width: 100%
                              height: 100%
                              min_value: 5
                              max_value: 100
                              value: 70
                              bg_opa: TRANSP
                              indicator:
                                bg_opa: TRANSP
                              knob:
                                bg_opa: TRANSP
                              on_press:
                                - lambda: id(ms_bri_drag) = true;
                              on_value:
                                - if:
                                    condition:
                                      lambda: return id(ms_bri_drag);
                                    then:
                                      - lambda: id(ms_brightness) = (int) x;
                                      - script.execute: ms_bri_render
                              on_release:
                                - lambda: |-
                                    id(ms_bri_drag) = false;
                                    id(ms_bri_user) = (int) x;
                                    id(ms_dim_suspended) = true;  // a manual change wins until the night ends
                                - script.execute: ms_apply_backlight
                    - label:
                        id: ms_bri_value
                        text: "70"
                        width: 30
                        text_align: RIGHT
                        text_font: ms_mono12
                        text_color: ms_c_fg
              # Sleep timer: OFF | 15 | 30 | 60 | 90 (D29)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Sleep timer", width: 10, flex_grow: 1, text_font: ms_sans16, text_color: ms_c_fg }
                    - obj:
                        width: SIZE_CONTENT
                        height: 30
                        styles: ms_st_box
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          pad_column: 0
                          pad_row: 0
                        widgets:
                          - button:
                              id: ms_sleep_opt_0
                              width: 38
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              border_width: 1
                              border_side: [RIGHT]
                              border_color: ms_c_line
                              on_click:
                                - script.execute:
                                    id: ms_set_sleep
                                    minutes: 0
                              widgets:
                                - label: { id: ms_sleep_opt_0_lbl, text: "OFF", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
                          - button:
                              id: ms_sleep_opt_1
                              width: 38
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              border_width: 1
                              border_side: [RIGHT]
                              border_color: ms_c_line
                              on_click:
                                - script.execute:
                                    id: ms_set_sleep
                                    minutes: 15
                              widgets:
                                - label: { id: ms_sleep_opt_1_lbl, text: "15", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
                          - button:
                              id: ms_sleep_opt_2
                              width: 38
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              border_width: 1
                              border_side: [RIGHT]
                              border_color: ms_c_line
                              on_click:
                                - script.execute:
                                    id: ms_set_sleep
                                    minutes: 30
                              widgets:
                                - label: { id: ms_sleep_opt_2_lbl, text: "30", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
                          - button:
                              id: ms_sleep_opt_3
                              width: 38
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              border_width: 1
                              border_side: [RIGHT]
                              border_color: ms_c_line
                              on_click:
                                - script.execute:
                                    id: ms_set_sleep
                                    minutes: 60
                              widgets:
                                - label: { id: ms_sleep_opt_3_lbl, text: "60", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
                          - button:
                              id: ms_sleep_opt_4
                              width: 38
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              on_click:
                                - script.execute:
                                    id: ms_set_sleep
                                    minutes: 90
                              widgets:
                                - label: { id: ms_sleep_opt_4_lbl, text: "90", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
              # Clock screen after (tap to cycle)
              - button:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  on_click:
                    - lambda: |-
                        static const int options[] = {1, 2, 5, 10, 0};
                        int next = 2;
                        for (int i = 0; i < 5; i++)
                          if (options[i] == id(ms_clock_after)) { next = options[(i + 1) % 5]; break; }
                        id(ms_clock_after) = next;
                        id(ms_last_touch) = millis();
                    - script.execute: ms_clock_setting_render
                  widgets:
                    - label: { text: "Clock screen after", width: 10, flex_grow: 1, text_font: ms_sans16, text_color: ms_c_fg }
                    - label: { id: ms_set_clock, text: "2 MIN >", text_font: ms_mono12, text_color: ms_c_dim2, text_letter_space: 1 }
              # Dim at night: ON | OFF (D30)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Dim at night", width: 10, flex_grow: 1, text_font: ms_sans16, text_color: ms_c_fg }
                    - obj:
                        width: SIZE_CONTENT
                        height: 30
                        styles: ms_st_box
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          pad_column: 0
                          pad_row: 0
                        widgets:
                          - button:
                              id: ms_dim_opt_0
                              width: 44
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              border_width: 1
                              border_side: [RIGHT]
                              border_color: ms_c_line
                              on_click:
                                - lambda: id(ms_dim_night) = true;
                                - script.execute: ms_dim_render
                                - script.execute: ms_apply_backlight
                              widgets:
                                - label: { id: ms_dim_opt_0_lbl, text: "ON", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
                          - button:
                              id: ms_dim_opt_1
                              width: 44
                              height: 100%
                              bg_color: ms_c_bg
                              bg_opa: COVER
                              on_click:
                                - lambda: id(ms_dim_night) = false;
                                - script.execute: ms_dim_render
                                - script.execute: ms_apply_backlight
                              widgets:
                                - label: { id: ms_dim_opt_1_lbl, text: "OFF", align: CENTER, text_font: ms_mono12, text_color: ms_c_dim, text_letter_space: 1 }
              # Night hours (set in Home Assistant: panel Reconfigure, D31)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Night hours", width: 10, flex_grow: 1, text_font: ms_sans16, text_color: ms_c_fg }
                    - label: { id: ms_set_night, text: "22:00 - 07:00", text_font: ms_mono12, text_color: ms_c_dim2, text_letter_space: 1 }
              # Output (opens the speaker list)
              - button:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  on_click:
                    - script.execute: ms_show_output
                  widgets:
                    - label: { text: "Output", width: 120, text_font: ms_sans16, text_color: ms_c_fg }
                    - label:
                        id: ms_set_output
                        text: "NONE >"
                        width: 10
                        flex_grow: 1
                        long_mode: DOT
                        height: 15  # one line, so DOT truncates instead of wrapping
                        text_align: RIGHT
                        text_font: ms_mono12
                        text_color: ms_c_dim2
                        text_letter_space: 1
              # Default speaker (set in Home Assistant: panel Reconfigure)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Default speaker", width: 150, text_font: ms_sans16, text_color: ms_c_fg }
                    - label:
                        id: ms_set_default
                        text: "-"
                        width: 10
                        flex_grow: 1
                        long_mode: DOT
                        height: 15  # one line, so DOT truncates instead of wrapping
                        text_align: RIGHT
                        text_font: ms_mono12
                        text_color: ms_c_dim2
                        text_letter_space: 1
              # Music source (Music Assistant arrives in Phase 8)
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
                  widgets:
                    - label: { text: "Music source", width: 10, flex_grow: 1, text_font: ms_sans16, text_color: ms_c_fg }
                    - label: { text: "SPOTIFY", text_font: ms_mono12, text_color: ms_c_dim2, text_letter_space: 1 }
              # About
              - obj:
                  width: 100%
                  height: 50
                  border_width: 1
                  border_side: [TOP, BOTTOM]
                  border_color: ms_c_line
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 14
                    pad_row: 0
