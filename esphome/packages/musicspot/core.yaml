                                    id: ms_np_dur
                                    text: ""
                                    align: BOTTOM_LEFT
                                    x: 104
                                    y: -6
                                    text_font: ms_mono16
                                    text_color: ms_c_dim
              # Progress: 2 px line, accent fill, 3x12 playhead
