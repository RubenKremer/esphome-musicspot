                          pad_top: 5
                          pad_bottom: 5
                          pad_left: 0
                          pad_right: 1
                        on_press:
                          - lambda: id(ms_seeking) = true;
                        on_release:
                          # Jump locally right away; Spotify reports the new position a moment later
                          - lambda: |-
                              id(ms_seeking) = false;
                              id(ms_pos_ms) = (int) ((int64_t) x * id(ms_dur_ms) / 1000);
                              id(ms_pos_at) = millis();
                          - script.execute:
                              id: ms_send_input
                              type: control
                              arg: seek
                              value: !lambda return (int) ((int64_t) x * id(ms_dur_ms) / 1000);
