                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 2 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 3 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 4 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 5 } }
                                - obj: !include { file: widgets/segment.yaml, vars: { group: vol, n: 6 } }
