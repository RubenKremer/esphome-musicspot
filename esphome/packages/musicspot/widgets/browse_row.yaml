# Browse row ${n} widget (used as `- button: !include`). Short tap = open/play, long press = add to queue.
id: ms_row_${n}
width: 100%
height: 54
hidden: true
bg_color: 0x161616
radius: 8
pad_all: 3
layout:
  type: flex
  flex_flow: ROW
  flex_align_cross: CENTER
on_short_click:
  - script.execute:
      id: ms_send_input
      type: tap
      arg: ""
      value: ${n}
on_long_press:
  - script.execute:
      id: ms_send_input
      type: queue
      arg: ""
      value: ${n}
widgets:
  - image:
      id: ms_row_${n}_thumb
      src: ms_thumb_${n}
      width: 48
      height: 48
      hidden: true
  - obj:
      height: 48
      flex_grow: 1
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      pad_left: 8
      clickable: false
      scrollable: false
      widgets:
        - label:
            id: ms_row_${n}_title
            text: ""
            width: 100%
            align: TOP_LEFT
            long_mode: DOT
            text_font: ms_font_body
            text_color: 0xFFFFFF
        - label:
            id: ms_row_${n}_subtitle
            text: ""
            width: 100%
            align: BOTTOM_LEFT
            long_mode: DOT
            text_font: ms_font_small
            text_color: 0x9A9A9A
