# Library list row ${n} (used as `- button: !include`). Tap = open/play, long press = queue.
id: ms_row_${n}
width: 100%
height: 50
hidden: true
styles: ms_st_row
layout:
  type: flex
  flex_flow: ROW
  flex_align_cross: CENTER
  pad_column: 12
on_short_click:
  - script.execute:
      id: ms_send_input
      type: tap
      arg: ""
      value: ${n}
on_long_press:
  - script.execute:
      id: ms_send_input
      type: queue
      arg: ""
      value: ${n}
widgets:
  - label:
      id: ms_row_${n}_num
      text: ""
      width: 22
      styles: ms_st_label
  - obj:
      width: 40
      height: 40
      bg_color: ms_c_cover
      bg_opa: COVER
      clickable: false
      scrollable: false
      widgets:
        - image:
            id: ms_row_${n}_thumb
            src: ms_thumb_${n}
            align: CENTER
            hidden: true
  - obj:
      width: 10
      flex_grow: 1
      height: 46
      clickable: false
      scrollable: false
      layout:
        type: flex
        flex_flow: COLUMN
        flex_align_main: CENTER
        pad_row: 2
      widgets:
        - label:
            id: ms_row_${n}_title
            text: ""
            width: 100%
            long_mode: DOT
            text_font: ms_sans16
            text_color: ms_c_fg
        - label:
            id: ms_row_${n}_sub
            text: ""
            width: 100%
            long_mode: DOT
            hidden: true
            text_font: ms_sans14
            text_color: ms_c_dim
  - label:
      id: ms_row_${n}_count
      text: ""
      styles: ms_st_label
